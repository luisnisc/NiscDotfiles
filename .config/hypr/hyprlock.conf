source = ~/.config/hypr/hyprlock-colors.conf

# General settings
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# Background setup (Blurred screenshot)
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Password Input Field
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = $background
    font_color = $text
    fade_on_empty = false
    font_family = Noto Sans
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# Clock (Hours and Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $primary
    font_size = 120
    font_family = Noto Sans Bold
    position = 0, -300
    halign = center
    valign = top
}

# Date Label
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = $primary
    font_size = 25
    font_family = Noto Sans
    position = 0, -150
    halign = center
    valign = top
}

# User Greeting
label {
    monitor =
    text = こんにちは, $USER
    color = $secondary
    font_size = 20
    font_family = Noto Sans
    position = 0, -40
    halign = center
    valign = center
}
